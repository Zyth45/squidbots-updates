[worldserver]

################################################################################################################
#    Dynamic.XP
#        Description: per-level-range XP rates, a rate a player can pick for themselves,
#                     and a reminder about it.
#
#        Dynamic.XP.Rate.Announce: 1 (Enable) tells each player their rate on login
#                                  0 (Disable) Default - the realm-wide reminder covers it
#
#        Dynamic.XP.Preset: the realm rate, and the default for every character that has
#                           not picked one. Read at startup and on ".reload config", so
#                           editing this line by hand works.
#                           1 (default) = no bonus
#                           3 / 5 / 7   = that flat rate for every level
#                           0           = the per-band curve below (needs Dynamic.XP.Rate = 1)
#
#        Dynamic.XP.Preset.PlayerChoice: 1 (Default) lets players change their own rate with
#                                        ".xp 1|3|5|7|dynamic|default"
#                                        0 = game masters only
#
#        Dynamic.XP.Rate: 1 (Enable) Default - gates the per-band curve (preset 0)
#                         0 (Disable)
#
#        Dynamic.XP.Rate.X-X: 1+ (Set a custom XP rate on that level range)
#                             0  (Reset custom XP rate to default on that level range)
#
#        Dynamic.XP.Reminder.*: the realm-wide note about ".xp". Interval is in minutes,
#                               0 turns the repeat off; Message is sent as-is (colour codes
#                               and all). It is announced when a player logs in and then
#                               every Interval minutes, to players who have not disabled
#                               automatic announcements.
#

Dynamic.XP.Rate.Announce = 0

Dynamic.XP.Preset = 1

Dynamic.XP.Preset.PlayerChoice = 1

Dynamic.XP.Rate = 1

Dynamic.XP.Rate.1-9 = 1
Dynamic.XP.Rate.10-19 = 2
Dynamic.XP.Rate.20-29 = 3
Dynamic.XP.Rate.30-39 = 4
Dynamic.XP.Rate.40-49 = 5
Dynamic.XP.Rate.50-59 = 6
Dynamic.XP.Rate.60-69 = 7
Dynamic.XP.Rate.70-79 = 8

Dynamic.XP.Reminder.Enable = 1

Dynamic.XP.Reminder.Interval = 40

Dynamic.XP.Reminder.Message = |cff4CFF00XP rate|r: pick your own with |cff4CFF00.xp 1|r, |cff4CFF00.xp 3|r, |cff4CFF00.xp 5|r or |cff4CFF00.xp 7|r, or |cff4CFF00.xp default|r to follow the realm. |cff4CFF00.xp|r shows what you are on.

##################################################################################################################
